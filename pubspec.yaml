name: pokebook
description: "Pokebook - Pokémon index app (Phundit Frontend Engineer Intern Assessment)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.5
  bloc: ^8.1.4
  hydrated_bloc: ^9.1.5

  # Reactive programming
  rxdart: ^0.28.0

  # Immutability / data modeling
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Functional error handling
  fpdart: ^1.1.0

  # Immutable collections
  fast_immutable_collections: ^9.2.0

  # Routing
  auto_route: ^8.2.0

  # Local storage / caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Dependency injection
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Networking
  dio: ^5.4.3+1

  # UI / assets
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  palette_generator: ^0.3.3+3 # for dominant-color gradient (bonus)
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  auto_size_text: ^3.0.0

  # Form validation (search input)
  formz: ^0.7.0

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.1
  auto_route_generator: ^8.0.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
